[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-mcp"
version = "0.1.0"
description = "Read-only MCP tools for Jarvis internal data"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jarvis-mcp = "jarvis_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["jarvis_mcp"]
